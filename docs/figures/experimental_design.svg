<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Experimental design: five annotation conditions sharing identical preprocessing and evaluation</title>
<style>
  .box { stroke-width: 1.5; rx: 8; }
  .title { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2430; }
  .sub { font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #4a5160; }
  .gray { fill: #eef0f2; stroke: #9aa1ab; }
  .teal { fill: #d6f0ec; stroke: #2a9d8f; }
  .purple { fill: #e9e2fb; stroke: #7c5cbf; }
  .indigo { fill: #dfe3fd; stroke: #4f46e5; }
  .arrow { stroke: #6c757d; stroke-width: 1.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#6c757d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect class="box gray" x="300" y="16" width="300" height="52"/>
<text class="title" x="450" y="38" text-anchor="middle">Shared preprocessing &amp; clustering</text>
<text class="sub" x="450" y="56" text-anchor="middle">QC, normalize, PCA, Leiden — identical across all conditions</text>

<line class="arrow" x1="450" y1="68" x2="450" y2="94" marker-end="url(#arrow)"/>
<line class="arrow" x1="450" y1="94" x2="90" y2="94" marker-end="none"/>
<line class="arrow" x1="450" y1="94" x2="810" y2="94" marker-end="none"/>
<line class="arrow" x1="90" y1="94" x2="90" y2="120" marker-end="url(#arrow)"/>
<line class="arrow" x1="270" y1="94" x2="270" y2="120" marker-end="url(#arrow)"/>
<line class="arrow" x1="450" y1="94" x2="450" y2="120" marker-end="url(#arrow)"/>
<line class="arrow" x1="630" y1="94" x2="630" y2="120" marker-end="url(#arrow)"/>
<line class="arrow" x1="810" y1="94" x2="810" y2="120" marker-end="url(#arrow)"/>

<rect class="box teal" x="20" y="120" width="140" height="70"/>
<text class="title" x="90" y="146" text-anchor="middle">Baseline 1</text>
<text class="sub" x="90" y="163" text-anchor="middle">Classical marker</text>
<text class="sub" x="90" y="178" text-anchor="middle">scoring (no LLM)</text>

<rect class="box purple" x="200" y="120" width="140" height="70"/>
<text class="title" x="270" y="146" text-anchor="middle">Baseline 2</text>
<text class="sub" x="270" y="163" text-anchor="middle">Single LLM call</text>
<text class="sub" x="270" y="178" text-anchor="middle">no orchestration</text>

<rect class="box purple" x="380" y="120" width="140" height="70"/>
<text class="title" x="450" y="146" text-anchor="middle">Baseline 3</text>
<text class="sub" x="450" y="163" text-anchor="middle">LLM + self-check</text>
<text class="sub" x="450" y="178" text-anchor="middle">loop (max 3 iter)</text>

<rect class="box indigo" x="560" y="120" width="140" height="70"/>
<text class="title" x="630" y="146" text-anchor="middle">Orchestrator</text>
<text class="sub" x="630" y="163" text-anchor="middle">Classical + LLM,</text>
<text class="sub" x="630" y="178" text-anchor="middle">arbitration</text>

<rect class="box indigo" x="740" y="120" width="140" height="70"/>
<text class="title" x="810" y="146" text-anchor="middle">Orchestrator</text>
<text class="sub" x="810" y="163" text-anchor="middle">Classical + LLM,</text>
<text class="sub" x="810" y="178" text-anchor="middle">confidence tie-break</text>

<line class="arrow" x1="90" y1="190" x2="90" y2="216" marker-end="none"/>
<line class="arrow" x1="270" y1="190" x2="270" y2="216" marker-end="none"/>
<line class="arrow" x1="450" y1="190" x2="450" y2="216" marker-end="none"/>
<line class="arrow" x1="630" y1="190" x2="630" y2="216" marker-end="none"/>
<line class="arrow" x1="810" y1="190" x2="810" y2="216" marker-end="none"/>
<line class="arrow" x1="90" y1="216" x2="450" y2="216" marker-end="none"/>
<line class="arrow" x1="450" y1="216" x2="810" y2="216" marker-end="none"/>
<line class="arrow" x1="450" y1="216" x2="450" y2="242" marker-end="url(#arrow)"/>

<rect class="box gray" x="300" y="242" width="300" height="66"/>
<text class="title" x="450" y="266" text-anchor="middle">Evaluation</text>
<text class="sub" x="450" y="283" text-anchor="middle">Accuracy, macro-F1, ARI, NMI</text>
<text class="sub" x="450" y="298" text-anchor="middle">5 trials/condition, mean ± std</text>

<rect x="20" y="330" width="860" height="76" fill="none" stroke="#c8cdd4" stroke-width="1" rx="6"/>
<rect x="36" y="346" width="14" height="14" class="teal"/>
<text class="sub" x="56" y="357">Classical (deterministic, free)</text>
<rect x="230" y="346" width="14" height="14" class="purple"/>
<text class="sub" x="250" y="357">Single-LLM family (no decomposition)</text>
<rect x="500" y="346" width="14" height="14" class="indigo"/>
<text class="sub" x="520" y="357">Orchestrator family (specialist + evaluator)</text>
<text class="sub" x="36" y="384">All LLM-involving conditions use identical prompts/marker-gene extraction where applicable; only the reconciliation mechanism differs.</text>
</svg>
